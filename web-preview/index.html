<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trail Gear — 贴纸装备柜</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mat: {
              50: '#FAF8F5',
              100: '#F4F0E8',
              200: '#EAE4D7',
              300: '#DDD5C4',
            },
            pine: {
              800: '#1A382B',
              900: '#10241B',
            },
            clay: {
              500: '#C86237',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F4F5F7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .phone-container {
      width: 100%;
      max-width: 414px;
      height: 870px;
      max-height: 96vh;
      border-radius: 46px;
      box-shadow: 0 25px 70px -15px rgba(0, 0, 0, 0.08), 0 0 0 6px #E5E7EB, 0 0 0 8px #D1D5DB;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #FFFFFF;
    }
    /* 纯白极简桌面微网格画布 */
    .sticker-board {
      background-color: #FFFFFF;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.025) 1px, transparent 1px);
      background-size: 20px 20px;
      min-height: 100%;
    }

    /* 贴纸从上方掉落到营地垫的重力弹性质感 */
    @keyframes stickerDrop {
      0% {
        opacity: 0;
        transform: translate3d(var(--pos-x, 0px), -480px, 0) scale(0.65) rotate(var(--rot-start, -15deg));
        filter: drop-shadow(0 35px 25px rgba(20, 15, 10, 0.12));
      }
      60% {
        opacity: 1;
        transform: translate3d(var(--pos-x, 0px), calc(var(--pos-y, 0px) + 14px), 0) scale(1.08) rotate(calc(var(--rot, 0deg) + 3deg));
        filter: drop-shadow(0 6px 10px rgba(20, 15, 10, 0.22));
      }
      80% {
        transform: translate3d(var(--pos-x, 0px), calc(var(--pos-y, 0px) - 6px), 0) scale(0.97) rotate(calc(var(--rot, 0deg) - 1.5deg));
        filter: drop-shadow(0 14px 18px rgba(20, 15, 10, 0.16));
      }
      100% {
        opacity: 1;
        transform: translate3d(var(--pos-x, 0px), var(--pos-y, 0px), 0) scale(1) rotate(var(--rot, 0deg));
        filter: drop-shadow(0 8px 16px rgba(20, 15, 10, 0.16));
      }
    }

    /* 贴纸拖拽释放后的安放微弹 */
    @keyframes stickerSettle {
      0% {
        transform: translate3d(var(--pos-x, 0px), var(--pos-y, 0px), 0) scale(1.1) rotate(var(--rot, 0deg));
        filter: drop-shadow(0 22px 26px rgba(20, 15, 10, 0.26));
      }
      50% {
        transform: translate3d(var(--pos-x, 0px), var(--pos-y, 0px), 0) scale(0.96) rotate(var(--rot, 0deg));
        filter: drop-shadow(0 5px 8px rgba(20, 15, 10, 0.20));
      }
      100% {
        transform: translate3d(var(--pos-x, 0px), var(--pos-y, 0px), 0) scale(1) rotate(var(--rot, 0deg));
        filter: drop-shadow(0 8px 16px rgba(20, 15, 10, 0.16));
      }
    }

    /* 随性散落桌面 (铺满大收纳垫) */
    .scattered-board {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 440px;
      touch-action: pan-y;
    }

    /* 贴纸实体 (支持掉落与自由拖动) */
    .sticker-entity {
      position: absolute;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      transform-origin: center center;
      will-change: transform, filter;
    }

    .sticker-entity.dropping {
      animation: stickerDrop 0.65s cubic-bezier(0.2, 1.25, 0.4, 1) both;
      animation-delay: calc(var(--delay, 0) * 80ms);
    }

    /* 新增贴纸回到首页时的自然重力掉落与弹性碰撞 */
    @keyframes newArrivalDrop {
      0% {
        opacity: 0;
        transform: translate3d(var(--pos-x, 0px), -480px, 0) scale(0.6) rotate(var(--rot-start, -35deg));
        filter: drop-shadow(0 45px 35px rgba(25, 20, 15, 0.1));
      }
      30% {
        opacity: 1;
      }
      62% {
        /* 触碰装备垫瞬间：物理微压扁 (Squash) */
        transform: translate3d(var(--pos-x, 0px), calc(var(--pos-y, 0px) + 16px), 0) scale(1.12, 0.92) rotate(calc(var(--rot, 0deg) + 3deg));
        filter: drop-shadow(0 6px 10px rgba(25, 20, 15, 0.32));
      }
      80% {
        /* 弹性回弹跳起：轻微拉伸 (Stretch) */
        transform: translate3d(var(--pos-x, 0px), calc(var(--pos-y, 0px) - 8px), 0) scale(0.96, 1.04) rotate(calc(var(--rot, 0deg) - 2deg));
        filter: drop-shadow(0 18px 22px rgba(25, 20, 15, 0.20));
      }
      92% {
        transform: translate3d(var(--pos-x, 0px), calc(var(--pos-y, 0px) + 2px), 0) scale(1.02, 0.98) rotate(var(--rot, 0deg));
        filter: drop-shadow(0 8px 12px rgba(25, 20, 15, 0.22));
      }
      100% {
        opacity: 1;
        transform: translate3d(var(--pos-x, 0px), var(--pos-y, 0px), 0) scale(1, 1) rotate(var(--rot, 0deg));
        filter: drop-shadow(0 8px 16px rgba(25, 20, 15, 0.16));
      }
    }

    .sticker-entity.new-arrival {
      animation: newArrivalDrop 0.82s cubic-bezier(0.18, 0.9, 0.32, 1.2) forwards !important;
      z-index: 9999 !important;
    }

    .sticker-entity.settling {
      animation: stickerSettle 0.26s cubic-bezier(0.2, 1.3, 0.4, 1) forwards;
    }

    /* 拖拽时的悬浮立体光影 */
    .sticker-entity.dragging {
      cursor: grabbing !important;
      z-index: 9999 !important;
      filter: drop-shadow(0 28px 34px rgba(20, 15, 10, 0.32)) !important;
      transition: filter 0.15s ease-out;
      pointer-events: auto;
    }

    /* 一键整理网格模式 */
    .grid-view-item {
      transition: transform 0.3s cubic-bezier(0.19, 1, 0.22, 1), box-shadow 0.3s ease;
      cursor: pointer;
    }
    .grid-view-item:hover {
      transform: translateY(-3px) scale(1.02);
    }
    .grid-view-item:active {
      transform: scale(0.96);
    }
    .frosted-glass {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2 sm:p-4">

  <!-- 模拟手机视口 -->
  <div class="phone-container">
    
    <!-- 顶部状态栏 -->
    <div class="pt-3 px-7 pb-1 flex justify-between items-center z-30 select-none frosted-glass">
      <span class="text-xs font-bold text-stone-800" id="clock-display">09:41</span>
      <div class="w-24 h-4 bg-stone-900 rounded-full mx-auto"></div>
      <div class="flex items-center space-x-2 text-xs text-stone-600">
        <i class="fa-solid fa-signal text-[10px]"></i>
        <i class="fa-solid fa-wifi text-[10px]"></i>
        <i class="fa-solid fa-battery-full text-xs"></i>
      </div>
    </div>

    <!-- 极简主页顶栏：简练、直奔主题 -->
    <header class="px-6 py-2.5 frosted-glass border-b border-stone-200/60 z-20 flex justify-between items-center">
      <div>
        <div class="flex items-center space-x-1.5">
          <span class="text-base font-black text-stone-900 tracking-tight">TRAIL GEAR</span>
          <span class="text-[10px] font-bold bg-pine-800/10 text-pine-800 px-2 py-0.5 rounded-full" id="stat-count-pill">0 件</span>
        </div>
        <p class="text-[11px] text-stone-500 font-medium" id="stat-weight-text">总负重 0.0 kg</p>
      </div>

      <!-- 核心控制：一键整理 / 随性散落 -->
      <div class="flex items-center space-x-1.5">
        <button id="toggle-layout-btn" onclick="toggleLayoutMode()" 
          class="bg-white hover:bg-stone-50 text-stone-800 text-xs font-bold px-3 py-1.5 rounded-full border border-stone-300 shadow-sm flex items-center gap-1.5 transition active:scale-95">
          <i class="fa-solid fa-grip text-pine-800" id="layout-icon"></i>
          <span id="layout-btn-text">一键整理</span>
        </button>

        <button onclick="reshuffleScattered()" id="reshuffle-btn"
          class="w-8 h-8 rounded-full bg-white hover:bg-stone-50 text-stone-700 border border-stone-300 shadow-sm flex items-center justify-center transition active:scale-90" title="重新随机散落">
          <i class="fa-solid fa-shuffle text-xs"></i>
        </button>
      </div>
    </header>

    <!-- 主展示区：主页即贴纸展示墙 -->
    <main class="flex-1 overflow-y-auto no-scrollbar relative sticker-board" id="main-content">
      
      <!-- ================= 页面 1：贴纸展示墙 (核心主页) ================= -->
      <section id="view-closet" class="flex flex-col h-full min-h-full p-3 pb-24 select-none">
        <!-- 桌面提示与状态 -->
        <div class="flex items-center justify-between text-[11px] text-stone-500 font-medium px-1 mb-2 select-none flex-shrink-0" id="closet-sub-bar">
          <span class="flex items-center gap-1.5 text-stone-700 font-bold">
            <i class="fa-solid fa-hand-pointer text-[10px] text-pine-800"></i>
            <span id="closet-hint-text">拖动贴纸随意摆放 · 点击查看详情</span>
          </span>
          <span class="text-[10px] bg-stone-100 text-stone-600 px-2.5 py-0.5 rounded-full font-bold border border-stone-200/60" id="closet-mode-tag">
            随性散落
          </span>
        </div>

        <!-- 营地装备收纳垫框 (纯白极简大收纳垫，高度延伸至按钮上方舒适距离) -->
        <div id="camp-mat-frame" class="flex-1 flex flex-col justify-between relative rounded-[28px] bg-white border-2 border-dashed border-stone-200 p-3 shadow-[0_4px_20px_rgba(0,0,0,0.02)] min-h-[500px] overflow-hidden transition-all">
          <!-- 垫子顶部状态线 -->
          <div class="flex justify-between items-center text-[10px] font-mono text-stone-400 select-none pb-2 border-b border-stone-100 mb-1 flex-shrink-0">
            <span class="flex items-center gap-1.5 font-bold tracking-wider text-stone-700">
              <i class="fa-solid fa-rug text-pine-800"></i> 装备收纳垫 · GEAR MAT
            </span>
            <span id="tray-stat-pill" class="bg-stone-50 text-stone-600 border border-stone-200/60 px-2 py-0.5 rounded-full font-bold text-[9px]">
              0 件贴纸
            </span>
          </div>

          <!-- 贴纸物理容器 (严格约束在垫子安全框内，受重力自然落定) -->
          <div id="stickers-container" class="flex-1 relative w-full min-h-[440px]">
            <!-- 动态注入贴纸元素 -->
          </div>

          <!-- 框内底部微水印 -->
          <div class="pt-2 pb-0.5 text-center pointer-events-none select-none border-t border-stone-100 mt-1 flex-shrink-0">
            <span class="text-[9px] font-mono tracking-widest text-stone-300 uppercase">TRAIL GEAR · CAMPING MAT ZONE</span>
          </div>
        </div>
      </section>

      <!-- ================= 页面 3：生成贴纸预览 & 填写 4 项表单 ================= -->
      <section id="view-maker" class="p-4 pb-28 space-y-3.5 hidden">
        <div class="flex items-center justify-between pb-1">
          <div class="flex items-center gap-2">
            <button onclick="switchView('closet')" class="w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-700 flex items-center justify-center transition border border-stone-200 shadow-2xs" title="取消并返回首页">
              <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <div>
              <h2 class="text-base font-black text-stone-900 flex items-center gap-1.5">
                <i class="fa-solid fa-sparkles text-pine-800"></i> 贴纸已生成
              </h2>
              <p class="text-[11px] text-stone-500">填写 4 项信息，一键保存并掉落至收纳垫</p>
            </div>
          </div>
          <button onclick="openCameraView()" class="px-2.5 py-1.5 rounded-full bg-stone-100 border border-stone-200 text-stone-700 flex items-center gap-1 hover:bg-stone-200 text-xs font-bold transition" title="重新拍摄">
            <i class="fa-solid fa-arrow-rotate-left text-[10px]"></i> 重拍
          </button>
        </div>

        <!-- 生成好的白色描边贴纸展示区 (1:1 正方形纯白极简衬底) -->
        <div class="w-full max-w-[280px] aspect-square mx-auto bg-stone-50 border-2 border-dashed border-stone-200 rounded-3xl flex items-center justify-center p-4 relative overflow-hidden shadow-inner">
          <canvas id="sticker-canvas" class="max-h-full max-w-full object-contain filter drop-shadow-xl"></canvas>
          <div id="upload-placeholder" class="text-center p-4 hidden">
            <p class="text-xs text-stone-500">正在生成贴纸...</p>
          </div>
        </div>

        <!-- 极简 4 字段表单：名称、重量、品牌、备注 -->
        <div class="bg-white p-4 rounded-2xl border border-stone-200/80 shadow-sm space-y-3">
          <!-- 1. 装备名称 -->
          <div>
            <label class="block text-xs font-bold text-stone-800 mb-1">装备名称 <span class="text-clay-500">*</span></label>
            <input type="text" id="maker-name" placeholder="如：胡巴 双人帐篷" 
              class="w-full px-3.5 py-2.5 text-sm bg-stone-50 border border-stone-300 rounded-xl focus:outline-none focus:border-pine-800">
          </div>

          <!-- 2. 重量 & 3. 品牌 -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-stone-800 mb-1">重量 (克 g) <span class="text-clay-500">*</span></label>
              <input type="number" id="maker-weight" placeholder="如：1350" 
                class="w-full px-3.5 py-2.5 text-sm bg-stone-50 border border-stone-300 rounded-xl focus:outline-none focus:border-pine-800">
            </div>
            <div>
              <label class="block text-xs font-bold text-stone-800 mb-1">品牌 <span class="text-stone-400 font-normal">(选填)</span></label>
              <input type="text" id="maker-brand" placeholder="如：MSR" 
                class="w-full px-3.5 py-2.5 text-sm bg-stone-50 border border-stone-300 rounded-xl focus:outline-none focus:border-pine-800">
            </div>
          </div>

          <!-- 4. 备注 -->
          <div>
            <label class="block text-xs font-bold text-stone-800 mb-1">备注 <span class="text-stone-400 font-normal">(选填)</span></label>
            <input type="text" id="maker-desc" placeholder="如：防风抗暴雨、三人四季温带使用" 
              class="w-full px-3.5 py-2.5 text-sm bg-stone-50 border border-stone-300 rounded-xl focus:outline-none focus:border-pine-800">
          </div>
        </div>

        <!-- 提交与关闭操作区 -->
        <div class="sticky bottom-2 inset-x-0 pt-2 z-40 space-y-2">
          <button id="save-gear-btn" onclick="saveGearFromMaker()" 
            class="w-full py-3.5 bg-stone-900 hover:bg-black text-white font-bold rounded-2xl shadow-xl transition flex items-center justify-center gap-2 active:scale-98 border border-stone-700">
            <i class="fa-solid fa-sparkles text-amber-300"></i> 生成贴纸并放入装备垫
          </button>
          <button onclick="switchView('closet')" 
            class="w-full py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold rounded-xl transition text-xs flex items-center justify-center gap-1.5 border border-stone-200">
            <i class="fa-solid fa-xmark text-xs"></i> 放弃并返回首页
          </button>
        </div>
      </section>
    </main>

    <!-- 高定质感悬浮按钮：拍照做贴纸 (深色钛金快门胶囊) -->
    <div id="home-action-bar" class="absolute bottom-6 inset-x-0 flex justify-center z-30 pointer-events-none">
      <button onclick="openCameraView()" 
        class="group pointer-events-auto flex items-center gap-3 pl-3.5 pr-6 py-2.5 rounded-full bg-stone-900/95 hover:bg-black text-white shadow-[0_16px_36px_-6px_rgba(25,20,15,0.35)] border border-stone-700/60 backdrop-blur-xl transition-all duration-300 transform hover:scale-[1.03] active:scale-95">
        <!-- 镜头快门微动标 -->
        <span class="w-8 h-8 rounded-full bg-gradient-to-tr from-stone-800 to-stone-700 border border-stone-500/40 flex items-center justify-center text-amber-200/90 shadow-inner group-hover:rotate-45 transition-transform duration-500">
          <i class="fa-solid fa-camera text-xs"></i>
        </span>
        <div class="flex flex-col text-left">
          <span class="text-xs font-black tracking-widest text-stone-100 uppercase">拍照做贴纸</span>
          <span class="text-[8.5px] text-stone-400 font-mono tracking-wider -mt-0.5">CAMERA TO STICKER</span>
        </div>
        <i class="fa-solid fa-arrow-right text-[10px] text-stone-400 group-hover:text-white transition-colors ml-0.5"></i>
      </button>
    </div>

    <!-- ================= 全屏实时拍照取景页面 (完全覆盖整个手机视口，沉浸式体验，绝无遮挡) ================= -->
    <section id="view-camera" class="absolute inset-0 bg-stone-950 text-white z-50 flex flex-col justify-between hidden">
      <!-- 顶部控制栏 (预留刘海与灵动岛安全区 pt-12) -->
      <div class="px-5 pt-12 pb-3 flex justify-between items-center z-10 bg-gradient-to-b from-black/80 to-transparent">
        <button onclick="switchView('closet')" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center backdrop-blur-md transition">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
        <div class="flex items-center gap-1.5 text-xs font-bold tracking-wider text-stone-200">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
          <span>取景框对准装备</span>
        </div>
        <button onclick="toggleCameraFacing()" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center backdrop-blur-md transition" title="翻转镜头">
          <i class="fa-solid fa-rotate text-xs"></i>
        </button>
      </div>

      <!-- 中间实时相机取景画面 (沉浸式黑色背景 + 正方形取景框) -->
      <div class="flex-1 relative flex items-center justify-center overflow-hidden mx-3 my-1 rounded-3xl bg-stone-900 border border-stone-800">
        <video id="camera-video" playsinline autoplay muted class="w-full h-full object-cover"></video>
        
        <!-- 1:1 正方形取景框 (带遮罩暗角 + 纯白精密准星四角) -->
        <div id="camera-target-box" class="w-[280px] h-[280px] max-w-[85%] max-h-[85%] aspect-square pointer-events-none border-2 border-white/40 rounded-3xl flex items-center justify-center relative shadow-[0_0_0_9999px_rgba(0,0,0,0.5)]">
          <div class="w-8 h-8 border-t-2 border-l-2 border-white absolute top-0 left-0 rounded-tl-xl"></div>
          <div class="w-8 h-8 border-t-2 border-r-2 border-white absolute top-0 right-0 rounded-tr-xl"></div>
          <div class="w-8 h-8 border-b-2 border-l-2 border-white absolute bottom-0 left-0 rounded-bl-xl"></div>
          <div class="w-8 h-8 border-b-2 border-r-2 border-white absolute bottom-0 right-0 rounded-br-xl"></div>
          <i class="fa-solid fa-plus text-white/50 text-sm"></i>
          <span class="absolute -bottom-6 text-[10px] font-mono tracking-widest text-white/60 uppercase">1 : 1 SQUARE FRAME</span>
        </div>

        <!-- 模拟闪光灯反馈层 -->
        <div id="camera-flash" class="absolute inset-0 bg-white transition-opacity duration-150 pointer-events-none hidden"></div>

        <!-- 无摄像头时的友好引导提示 -->
        <div id="camera-fallback-tip" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-stone-900/90 hidden">
          <div class="w-14 h-14 rounded-2xl bg-white/10 text-amber-300 flex items-center justify-center text-2xl mb-3">
            <i class="fa-solid fa-camera"></i>
          </div>
          <p class="text-sm font-bold text-stone-100">点击下方快门或相册选图</p>
          <p class="text-xs text-stone-400 mt-1 max-w-[200px]">可直接调用设备原生相机拍照或选择照片生成贴纸</p>
        </div>
      </div>

      <!-- 底部快门操作底栏 (舒适高位，绝不贴底遮挡) -->
      <div class="px-8 pt-3 pb-8 flex items-center justify-between bg-gradient-to-t from-black/90 to-transparent z-10">
        <!-- 从相册选 -->
        <button onclick="document.getElementById('image-file-input').click()" 
          class="flex flex-col items-center gap-1 text-stone-300 hover:text-white transition group">
          <div class="w-12 h-12 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center text-base group-hover:scale-105 transition-transform">
            <i class="fa-solid fa-image"></i>
          </div>
          <span class="text-[10px] font-bold">本地相册</span>
        </button>

        <!-- 核心拍照大快门按钮 (Apple / Leica 双环快门) -->
        <button onclick="takePhotoFromCamera()" 
          class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center p-1.5 transition-transform active:scale-90 shadow-2xl hover:scale-105">
          <div class="w-full h-full bg-white rounded-full transition-colors active:bg-stone-300 shadow-inner"></div>
        </button>

        <!-- 选择图片 -->
        <button onclick="document.getElementById('image-file-input').click()" 
          class="flex flex-col items-center gap-1 text-stone-300 hover:text-white transition group">
          <div class="w-12 h-12 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center text-base group-hover:scale-105 transition-transform">
            <i class="fa-solid fa-cloud-arrow-up"></i>
          </div>
          <span class="text-[10px] font-bold">选择图片</span>
        </button>
      </div>

      <input type="file" id="image-file-input" accept="image/*" class="hidden">
    </section>

  </div>

  <!-- 贴纸点击查看详情弹窗 (Apple Bottom Sheet 风格) -->
  <div id="modal-gear-detail" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-end justify-center hidden" onclick="closeModal('modal-gear-detail')">
    <div class="bg-white w-full max-w-sm rounded-t-3xl p-6 shadow-2xl space-y-4 transform transition-all duration-300" onclick="event.stopPropagation()">
      <div class="w-10 h-1 bg-stone-300 rounded-full mx-auto -mt-2 mb-2"></div>
      
      <!-- 居中贴纸大图 -->
      <div class="h-48 bg-stone-50 rounded-2xl flex items-center justify-center p-3 relative overflow-hidden border border-stone-200/80">
        <img id="detail-gear-img" src="" class="max-h-full max-w-full object-contain filter drop-shadow-xl" alt="">
      </div>

      <!-- 装备详情信息 -->
      <div class="space-y-2">
        <div class="flex justify-between items-start">
          <div>
            <p id="detail-gear-brand" class="text-xs font-bold text-clay-500 uppercase tracking-wider"></p>
            <h3 id="detail-gear-name" class="text-lg font-black text-stone-900"></h3>
          </div>
          <span id="detail-gear-weight" class="text-sm font-black text-pine-800 bg-pine-800/10 px-2.5 py-1 rounded-lg"></span>
        </div>

        <!-- 备注展示 -->
        <div id="detail-gear-desc-wrap" class="bg-stone-50 p-2.5 rounded-xl border border-stone-200/60 hidden">
          <p class="text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-0.5">装备备注</p>
          <p id="detail-gear-desc" class="text-xs text-stone-700 leading-relaxed"></p>
        </div>
      </div>

      <!-- 操作按钮 -->
      <div class="pt-2 flex space-x-2.5">
        <button id="delete-gear-btn" class="flex-1 py-3 text-xs text-red-600 font-bold bg-red-50 hover:bg-red-100 rounded-xl transition">
          从贴纸墙撕下删除
        </button>
        <button onclick="closeModal('modal-gear-detail')" class="flex-1 py-3 text-xs text-stone-700 font-bold bg-stone-100 hover:bg-stone-200 rounded-xl transition">
          完成
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
